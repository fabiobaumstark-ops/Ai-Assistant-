# Home Assistant (Container-Installation) fuer den Raspberry Pi
# Starten:  docker compose up -d      (im Ordner dieser Datei)
# Aufrufen: http://<IP-des-Pi>:8123
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config                    # Konfiguration bleibt hier gespeichert
      - /etc/localtime:/etc/localtime:ro
      - /run/dbus:/run/dbus:ro              # fuer Bluetooth
    environment:
      - TZ=Europe/Berlin
    restart: unless-stopped
    privileged: true
    network_mode: host                      # noetig, damit Geraete im Netz gefunden werden
